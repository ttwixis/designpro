{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 mt-4">
    <h2>Управление категориями</h2>
    <a href="{% url 'superadmin_panel' %}" class="btn btn-secondary">Назад в панель</a>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5>Добавить категорию</h5>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.name }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Добавить</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <ul class="list-group">
                    {% for cat in categories %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            {{ cat.name }}
                            <a href="{% url 'delete_category' cat.pk %}" class="btn btn-sm btn-danger" onclick="return confirm('Удалить категорию? ВСЕ заявки этой категории будут удалены!')">Удалить</a>
                        </li>
                    {% empty %}
                        <li class="list-group-item">Категорий нет</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
