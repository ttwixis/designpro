{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title">Обработка заявки: {{ req.title }}</h3>
                <p class="text-muted">Описание: {{ req.description }}</p>
                <p><img src="{{ req.image.url }}" style="max-height: 200px;" class="img-thumbnail" alt="Фото"></p>
                
                <hr>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="fw-bold">Выберите действие:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="new_status" id="status1" value="in_progress" checked>
                            <label class="form-check-label" for="status1">Принять в работу (требуется комментарий)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="new_status" id="status2" value="done">
                            <label class="form-check-label" for="status2">Завершить (требуется картинка дизайна)</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Комментарий (для «В работу»)</label>
                        {{ form.comment }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Изображение дизайна (для «Выполнено»)</label>
                        {{ form.design_image }}
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'superadmin_panel' %}" class="btn btn-secondary">Назад</a>
                        <button type="submit" class="btn btn-success">Применить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
